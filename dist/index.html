<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="先用生活故事和数字例子把金融讲懂，再逐层进入专业知识。" />
    <meta name="theme-color" content="#071b2b" />
    <title>Finpedia｜金融百科</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23071b2b'/%3E%3Cpath d='M17 43V21h30M21 39l8-9 7 5 11-14' fill='none' stroke='%235de2b5' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到主要内容</a>
    <header class="topbar">
      <button class="icon-button mobile-menu" id="menuButton" aria-label="打开知识目录" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <a class="brand" href="#/" aria-label="Finpedia 首页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><path d="M7 23V10h18M9 21l5-6 4 3 7-9" /></svg>
        </span>
        <span>Fin<span>pedia</span></span>
      </a>
      <nav class="topnav" aria-label="主导航">
        <a href="#/">首页</a>
        <a href="#/day">生活里的金融</a>
        <a href="#/map">知识地图</a>
        <a href="#/tools">互动工具</a>
      </nav>
      <div class="header-search" role="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
        <input id="globalSearch" type="search" autocomplete="off" placeholder="搜索知识、产品、指标、术语…" aria-label="搜索金融知识" aria-controls="searchResults" />
        <kbd>⌘ K</kbd>
        <div class="search-results" id="searchResults" role="listbox" hidden></div>
      </div>
      <button class="icon-button theme-toggle" id="themeToggle" aria-label="切换深浅色模式">
        <svg class="sun-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
      </button>
    </header>

    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="金融知识分类">
        <div class="sidebar-heading">
          <span>金融知识分类</span>
          <span id="categoryCount"></span>
        </div>
        <nav id="categoryNav"></nav>
        <div class="sidebar-note">
          <span class="pulse-dot"></span>
          <div><strong>持续扩展</strong><small>数据驱动的知识结构</small></div>
        </div>
      </aside>
      <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
      <main id="main-content" tabindex="-1">
        <div id="app" aria-live="polite"></div>
      </main>
    </div>

    <div class="command-backdrop" id="commandBackdrop" hidden>
      <section class="command-palette" role="dialog" aria-modal="true" aria-labelledby="commandTitle">
        <div class="command-input-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
          <label class="sr-only" id="commandTitle" for="commandSearch">搜索金融知识</label>
          <input id="commandSearch" type="search" autocomplete="off" placeholder="输入中文、英文或缩写…" />
          <kbd>ESC</kbd>
        </div>
        <div class="command-results" id="commandResults"></div>
        <footer><span>↑↓ 选择</span><span>Enter 打开</span><span>支持模糊搜索与别名</span></footer>
      </section>
    </div>

    <script src="./data.js"></script>
    <script src="./plain-content.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
